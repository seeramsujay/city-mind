<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1c"/>
      <stop offset="100%" stop-color="#101c36"/>
    </linearGradient>
    <linearGradient id="cityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <linearGradient id="mindGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="4" y="4" rx="96" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Neural Mesh Connections (Sky) -->
  <line x1="160" y1="120" x2="250" y2="80" stroke="#7928ca" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="250" y1="80" x2="340" y2="120" stroke="#7928ca" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="250" y1="80" x2="250" y2="170" stroke="#00f2fe" stroke-width="2"/>
  <line x1="160" y1="120" x2="210" y2="200" stroke="#00f5d4" stroke-width="1.5"/>
  <line x1="340" y1="120" x2="290" y2="200" stroke="#00f5d4" stroke-width="1.5"/>

  <!-- Neural Mind Synapse Nodes (Top Sky) -->
  <circle cx="250" cy="80" r="10" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="160" cy="120" r="8" fill="#ff0080" filter="url(#glow)"/>
  <circle cx="340" cy="120" r="8" fill="#ff0080" filter="url(#glow)"/>
  <circle cx="250" cy="170" r="7" fill="#00f5d4"/>

  <!-- Futuristic Metropolitan Skyline Buildings -->
  <!-- Building 1 (Far Left) -->
  <rect x="110" y="270" width="45" height="130" rx="4" fill="#13203c" stroke="#4facfe" stroke-width="2"/>
  <!-- Building 2 -->
  <rect x="165" y="220" width="55" height="180" rx="6" fill="#182a4d" stroke="#00f5d4" stroke-width="2.5"/>
  <line x1="192" y1="235" x2="192" y2="390" stroke="#00f5d4" stroke-width="2" stroke-dasharray="8 12"/>
  <!-- Central Tower (Skyscraper with Spire) -->
  <rect x="230" y="180" width="60" height="220" rx="8" fill="#1e345e" stroke="url(#cityGrad)" stroke-width="3" filter="url(#glow)"/>
  <line x1="260" y1="140" x2="260" y2="180" stroke="#00f2fe" stroke-width="4" stroke-linecap="round"/>
  <circle cx="260" cy="138" r="4" fill="#ffffff" filter="url(#glow)"/>
  <!-- Building 4 -->
  <rect x="300" y="240" width="50" height="160" rx="6" fill="#182a4d" stroke="#00f5d4" stroke-width="2.5"/>
  <!-- Building 5 (Far Right) -->
  <rect x="360" y="290" width="45" height="110" rx="4" fill="#13203c" stroke="#4facfe" stroke-width="2"/>

  <!-- City Grid Base Highway / Fiber Bus -->
  <line x1="80" y1="400" x2="420" y2="400" stroke="url(#cityGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="100" y1="415" x2="400" y2="415" stroke="#7928ca" stroke-width="3" stroke-linecap="round"/>
</svg>
